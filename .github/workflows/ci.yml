name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports:
          - 6333:6333
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: marketiq_test
          POSTGRES_PASSWORD: test-only-ci-password
          POSTGRES_DB: marketiq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketiq_test -d marketiq_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      MARKETIQ_TEST_QDRANT_URL: http://localhost:6333
      MARKETIQ_TEST_DATABASE_URL: postgresql+psycopg://marketiq_test:test-only-ci-password@localhost:5432/marketiq_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
      - run: uv sync --locked --python 3.13
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy
      - run: curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:6333/readyz
      - run: uv run --locked pytest --cov=app --cov-fail-under=85
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
