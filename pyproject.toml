[project]
name = "marketiq"
version = "0.1.0"
description = "Evidence-backed financial intelligence platform"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic-settings>=2.10,<3",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.13,<5",
  "filelock>=3.19,<4",
  "sqlalchemy>=2.0.40,<2.1",
  "alembic>=1.16,<2",
  "psycopg[binary]>=3.2,<4",
  "tzdata>=2025.2",
  "qdrant-client>=1.15,<2",
  "sentence-transformers>=5,<6",
  "langgraph>=1.0,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-cov>=6,<8", "ruff>=0.12,<1", "mypy>=1.17,<2"]
ml = [
    "scikit-learn>=1.7,<2",
    "xgboost>=3,<4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra --strict-markers"
markers = ["integration: requires external services", "live: explicitly enabled real provider test"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "backend"
files = ["backend/app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "langgraph.*", "langsmith.*", "sklearn.*", "xgboost.*", "numpy.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

